version: "3.9"

services:
  app:
    image: mcr.microsoft.com/devcontainers/python:1-3.12-bullseye
    container_name: esbot-backend-app
    working_dir: /workspace
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    environment:
      DATABASE_URL: postgresql://esbot_user:esbot_password@db:5432/esbot
    depends_on:
      - db
    ports:
      - "8000:8000"

  db:
    image: postgres:16
    container_name: esbot-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: esbot
      POSTGRES_USER: esbot_user
      POSTGRES_PASSWORD: esbot_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
